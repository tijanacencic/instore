<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Links Instore</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <img id="slide" src="links1.jpg">

  <script>
    const images = [
      "links1.jpg",
      "links2.jpg",
      "links3.jpg"
    ];

    let current = 0;

    setInterval(() => {
      current = (current + 1) % images.length;
      document.getElementById("slide").src =
        images[current] + "?v=" + Date.now();
    }, 10000);

    setTimeout(() => {
      location.reload();
    }, 300000);
  </script>

</body>
</html>
